name: Sync fork with upstream (rebase)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream  https://github.com/ahrm/sioyek.git
          git fetch upstream main

      - name: Rebase main onto upstream/main
        id: rebase
        run: |
          set -euo pipefail
          git checkout main
          if git rebase upstream/main; then
            echo "had_conflicts=false" >>"$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            echo "had_conflicts=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Push updated main
        if: steps.rebase.outputs.had_conflicts == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force-with-lease \
            https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} \
            main
